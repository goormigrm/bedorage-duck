<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>배도라지 덕 — 프리뷰</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
  <style>
    html, body { margin: 0; height: 100%; background: #0e100c; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; font-family: "IBM Plex Sans KR", sans-serif; cursor: none; }
    #stage { position: relative; width: 1280px; height: 720px; transform-origin: center; }
    #stage canvas { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; display: block; }
    #stage canvas.hud { pointer-events: none; }
    #hint {
      position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
      font: 500 12px "IBM Plex Mono", monospace; letter-spacing: .04em;
      color: #b3b8a5; background: rgba(20,22,16,.7); padding: 6px 12px; border-radius: 4px;
      transition: opacity .6s; pointer-events: none; white-space: nowrap; z-index: 5;
    }
    #hint b { color: #ffd84a; font-weight: 600; }
  </style>
</head>
<body>
  <div id="stage">
    <div id="hint"><b>H</b> HUD · <b>C</b> 카메라 · <b>M</b> 맵 · <b>1/2/3</b> 봇 난이도 · <b>R</b> 재시작 · <b>L</b> 레터박스 · <b>F</b> 전체화면 · <b>P</b> 일시정지 · <b>N</b> 소리</div>
  </div>
  <script type="module" src="/src/preview.ts"></script>
</body>
</html>
